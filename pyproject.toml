[project]
name = "cex"
version = "0.1.0"
description = "Load, clean, and model BLS Consumer Expenditure Survey (Interview) microdata"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=16",
]

[project.scripts]
cex = "cex.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
